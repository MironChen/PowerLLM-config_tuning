[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "powerllm"
version = "0.1.0"
description = "Local-first RAG application for legal document analysis."
readme = "README.md"
authors = [
    { name = "Riming Chen", email = "mironchen@icloud.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "beautifulsoup4",
    "cn2an",
    "docling>=2.0.0",
    "docling-core",
    "fastapi",
    "google-genai",
    "httpx",
    "imagehash",
    "langchain>=1.2.0",
    "langchain-chroma",
    "langchain-community>=0.3.1",
    "langchain-core>=1.2.0",
    "langchain-google-genai",
    "langchain-openai",
    "langchain-text-splitters",
    "langgraph",
    "markitdown",
    "openai",
    "opencv-python-headless",
    "optuna",
    "optuna-dashboard",
    "paddleocr",
    "pathlib>=1.0.1",
    "pillow",
    "protobuf>=3.19,<4",
    "pydantic>=2.0",
    "python-multipart",
    "python-dotenv",
    "rank-bm25",
    "rich",
    "sentence-transformers",
    "sqlite-vss>=0.1.2",
    "typer",
    "typing-extensions",
    "unstructured",
    "uvicorn",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
